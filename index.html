<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Dev: always fetch fresh code/styles so edits show on a normal refresh -->
<meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>OrbitalWatch — Space Junk Tracker</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="styles.css" />
<script src="https://unpkg.com/satellite.js@5.0.0/dist/satellite.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Top bar -->
  <header id="topbar">
    <div class="brand">
      <span class="logo">🛰️</span>
      <h1>OrbitalWatch</h1>
      <span class="subtitle">Space Debris Tracker · CelesTrak / NORAD data</span>
    </div>
    <div class="search-box">
      <input id="search-input" type="text" placeholder="Search name or NORAD ID…" autocomplete="off" />
      <div id="search-results" class="hidden"></div>
    </div>
  </header>

  <!-- Left panel: layers & filters -->
  <aside id="left-panel" class="panel">
    <h2>Catalogs</h2>
    <div id="group-toggles"></div>
    <h2>Filters</h2>
    <div class="filter-row">
      <label>Altitude range (km)</label>
      <div class="range-pair">
        <input id="alt-min" type="number" value="0" min="0" max="50000" step="100" />
        <span>–</span>
        <input id="alt-max" type="number" value="50000" min="0" max="50000" step="100" />
      </div>
    </div>
    <div class="filter-row">
      <label><input id="show-orbits" type="checkbox" /> Show orbit on select</label>
    </div>
    <div class="filter-row">
      <label><input id="show-labels" type="checkbox" checked /> Show selected label</label>
    </div>
    <div class="filter-row">
      <label>Point size <input id="point-size" type="range" min="1" max="8" step="0.5" value="3" /></label>
    </div>
    <h2>Statistics</h2>
    <div id="stats"></div>
  </aside>

  <!-- Right panel: selected object info -->
  <aside id="info-panel" class="panel hidden">
    <button id="info-close" title="Close">✕</button>
    <h2 id="info-name">—</h2>
    <p id="info-about"></p>
    <table id="info-table"></table>
    <button id="follow-btn" class="action-btn">Follow object</button>
  </aside>

  <!-- Bottom bar: time controls -->
  <footer id="timebar">
    <button id="btn-now" title="Jump to real time">⏺ NOW</button>
    <button id="btn-play" title="Play / Pause">⏸</button>
    <div class="speed-group" id="speed-group">
      <button data-speed="1" class="active">1×</button>
      <button data-speed="60">60×</button>
      <button data-speed="600">600×</button>
      <button data-speed="3600">1h/s</button>
      <button data-speed="-60">-60×</button>
    </div>
    <span id="sim-clock">—</span>
    <span id="fps" class="dim"></span>
  </footer>

  <!-- Loading overlay -->
  <div id="loading">
    <div class="loader-ring"></div>
    <div id="loading-text">Fetching orbital element sets…</div>
  </div>

  <div id="tooltip" class="hidden"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
